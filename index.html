<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Escolar - Gestión Docente</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Barra Superior y Selector de Rol -->
    <header class="navbar">
        <div class="logo">🏫 Portal Escolar</div>
        <div class="role-selector">
            <label for="roleSelect">Vista actual:</label>
            <select id="roleSelect">
                <option value="maestro">👨‍🏫 Modo Maestro (Editar)</option>
                <option value="alumno">🎓 Modo Alumno (Solo lectura)</option>
            </select>
        </div>
    </header>

    <!-- Navegación por Pestañas -->
    <nav class="tabs">
        <button class="tab-btn active" data-tab="calificaciones">📊 Alumnos y Notas</button>
        <button class="tab-btn" data-tab="horarios">🕒 Horarios de Clase</button>
    </nav>

    <main class="container">

        <!-- SECCIÓN 1: ALUMNOS, MATERIAS Y NOTAS -->
        <section id="calificaciones" class="tab-content active">
            
            <!-- Panel de control exclusivo para Maestros -->
            <div class="teacher-controls maestro-only">
                <div class="control-box">
                    <h3>➕ Agregar Alumno</h3>
                    <div class="input-group">
                        <input type="text" id="nuevoAlumnoInput" placeholder="Nombre del alumno...">
                        <button id="btnAgregarAlumno" class="btn-primary">Agregar</button>
                    </div>
                </div>

                <div class="control-box">
                    <h3>📚 Agregar Materia</h3>
                    <div class="input-group">
                        <input type="text" id="nuevaMateriaInput" placeholder="Ej: Español, Matemáticas...">
                        <button id="btnAgregarMateria" class="btn-secondary">Agregar</button>
                    </div>
                </div>
            </div>

            <!-- Tabla dinámica de Calificaciones -->
            <div class="table-responsive">
                <table id="tablaNotas">
                    <thead id="tablaHead">
                        <!-- Se llena dinámicamente con JS -->
                    </thead>
                    <tbody id="tablaBody">
                        <!-- Se llena dinámicamente con JS -->
                    </tbody>
                </table>
            </div>
            <p class="hint maestro-only">💡 <strong>Tip:</strong> Haz clic en el nombre de un alumno o materia para editarlo, o cambia los números de las notas directamente. El promedio se calcula solo.</p>
        </section>

        <!-- SECCIÓN 2: HORARIOS DE CLASE -->
        <section id="horarios" class="tab-content">
            <div class="section-header">
                <h2>Horario Semanal / Diario</h2>
                <button id="btnAgregarHorario" class="btn-primary maestro-only">+ Añadir Bloque Horario</button>
            </div>

            <div class="table-responsive">
                <table id="tablaHorarios">
                    <thead>
                        <tr>
                            <th>Hora</th>
                            <th>Lunes</th>
                            <th>Martes</th>
                            <th>Miércoles</th>
                            <th>Jueves</th>
                            <th>Viernes</th>
                            <th class="maestro-only">Acción</th>
                        </tr>
                    </thead>
                    <tbody id="horariosBody">
                        <!-- Se llena dinámicamente con JS -->
                    </tbody>
                </table>
            </div>
        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
